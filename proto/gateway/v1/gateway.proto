syntax = "proto3";

package gateway.v1;

option go_package = "github.com/filipgorny/ai-architect/proto/gateway/v1;gatewayv1";

// Gateway to BFF dla aplikacji Electron: proxuje skanowanie do serwisu scanner
// i serwuje graf zależności z bazy. API jest celowo proste i samodzielne
// (bez importów), by Electron ładował je przez @grpc/proto-loader.
service Gateway {
  // Scan uruchamia skan wierzchni (proxy do scannera) i strumieniuje postęp.
  rpc Scan(ScanRequest) returns (stream Progress);
  // GetGraph zwraca graf projektu: dla monorepo — serwisy (aplikacje) jako węzły,
  // dla pojedynczej app — jej encje. (0 = ostatni przeskanowany).
  rpc GetGraph(GraphRequest) returns (Graph);
  // ScanApp robi głęboki skan jednej aplikacji (po app_id) i strumieniuje postęp.
  rpc ScanApp(ScanAppRequest) returns (stream Progress);
  // GetAppGraph zwraca wewnętrzny graf jednej aplikacji (klasy/kontrolery/serwisy).
  rpc GetAppGraph(AppGraphRequest) returns (Graph);
  // ListProjects zwraca przeskanowane projekty.
  rpc ListProjects(Empty) returns (Projects);
  // AiEdit zmienia kod wg polecenia (proxy do serwisu ai → LLM).
  rpc AiEdit(AiEditRequest) returns (AiEditResponse);
  // AiModel zwraca nazwę aktualnie używanego modelu (proxy do ai).
  rpc AiModel(Empty) returns (AiModelResponse);
  // AiSetProvider przełącza dostawcę LLM w serwisie ai (proxy).
  rpc AiSetProvider(AiProviderRequest) returns (AiModelResponse);
  // AiSetClaudeToken zapisuje token OAuth Claude w serwisie ai (proxy).
  rpc AiSetClaudeToken(AiClaudeTokenRequest) returns (AiClaudeTokenStatus);
  // AiClaudeStatus mówi, czy serwis ai ma zapisany token Claude (proxy).
  rpc AiClaudeStatus(Empty) returns (AiClaudeTokenStatus);
  // AiReview zwraca uwagi recenzenta do kodu (per linia) — proxy do ai.
  rpc AiReview(AiReviewRequest) returns (AiReviewResponse);
  // AiComplete zwraca podpowiedź autouzupełniania (Copilot) w miejscu kursora.
  rpc AiComplete(AiCompleteRequest) returns (AiCompleteResponse);
  // PublishEvent / ListEvents — eventy powiązane z plikiem/nodem (proxy do events).
  rpc PublishEvent(EventInput) returns (Event);
  rpc ListEvents(EventQuery) returns (EventList);

  // --- Operacje na plikach (wykonywane PRZEZ gateway; Electron nie rusza fs) ---
  rpc ReadFile(FilePath) returns (FileContent);
  rpc SaveFile(SaveRequest) returns (FileResult);
  rpc CreateFile(CreateRequest) returns (FileResult);
  rpc CreateFolder(CreateFolderRequest) returns (FileResult);
  rpc RenameFile(RenameRequest) returns (FileResult);
  rpc MoveFile(MoveRequest) returns (FileResult);
  rpc DeletePath(FilePath) returns (FileResult);
  rpc ResolveImport(ResolveRequest) returns (FileResult);
  // Links analyzes a file (proxy to scanner: tree-sitter / LSP) and returns its navigable
  // code links — import paths and imported-symbol usages — for editor go-to-definition.
  rpc Links(LinkQuery) returns (CodeLinks);

  // Przeglądanie dysku i szukanie projektów (przez filer; działa też w Dockerze).
  rpc HomeDir(Empty) returns (FileResult);
  rpc ListDir(FilePath) returns (DirListing);
  rpc FindProjects(FilePath) returns (FoundProjects);
  // Wykrycie konwencji nazw plików i rozszerzenia katalogu (przez filer).
  rpc DetectConventions(FilePath) returns (Conventions);

  // WatchFiles strumieniuje zmiany na dysku w katalogu projektu (przez filer),
  // by graf mógł reagować na utworzenie/usunięcie/zmianę plików.
  rpc WatchFiles(FilePath) returns (stream FileEvent);

  // AiAgent: ai planuje operacje na plikach/folderach (JSON), gateway je WYKONUJE.
  rpc AiAgent(AiAgentRequest) returns (AiAgentResponse);

  // AiAsk: agent ze skillami (DWUKIERUNKOWY stream). Aplikacja wysyła start + wyniki skilli;
  // gateway proxuje do serwisu ai. Skille (read_file/list_dir/get_graph) wykonuje aplikacja.
  rpc AiAsk(stream AiAskClientMsg) returns (stream AiAskEvent);

  // Graph state (viewport/layout) persisted in Postgres by the designer.
  rpc SaveGraphState(GraphStateRequest) returns (FileResult);
  rpc GetGraphState(GraphStateKey) returns (GraphStateResponse);

  // --- User scripts (proxy to the scripting service; Postgres) ---
  rpc ListScripts(ScriptQuery) returns (ScriptList);
  rpc GetScript(ScriptId) returns (Script);
  rpc SaveScript(Script) returns (Script);
  rpc DeleteScript(ScriptId) returns (FileResult);

  // --- App logs (proxy to the logs service; its own Postgres database) ---
  rpc AppendLogs(LogBatch) returns (FileResult);
  rpc ListLogs(LogQuery) returns (LogList);
  rpc ClearLogs(Empty) returns (FileResult);

  // --- Git (proxy to the git service) ---
  // UploadRepo streams the project's .git directory to the git service so it can
  // answer authorship/review queries (the open project "sends" its .git here).
  rpc UploadRepo(stream GitChunk) returns (GitUploadResult);
  // GitFileInfo — author of the last commit touching a file.
  rpc GitFileInfo(GitFileInfoRequest) returns (GitFileInfoResponse);
  // GitReviewStatus — files changed on the current branch vs its base branch.
  rpc GitReviewStatus(GitReviewRequest) returns (GitReviewResponse);
  // GitFileDiff — added/modified line numbers for one file (editor highlighting).
  rpc GitFileDiff(GitFileDiffRequest) returns (GitFileDiffResponse);
}

message GitChunk {
  string repo_path = 1;
  string rel_path = 2;
  bytes data = 3;
  bool eof = 4;
}

message GitUploadResult {
  string repo_path = 1;
  bool ok = 2;
  int32 files = 3;
  string head_branch = 4;
}

message GitFileInfoRequest {
  string repo_path = 1;
  string file = 2;
}

message GitFileInfoResponse {
  bool tracked = 1;
  string last_author = 2;
  string last_author_email = 3;
  string last_commit_hash = 4;
  int64 last_commit_time = 5;
  string last_message = 6;
}

message GitReviewRequest {
  string repo_path = 1;
  string base = 2;
}

message GitChangedFile {
  string path = 1;
  string abs_path = 2;
  string status = 3;
}

message GitReviewResponse {
  string base = 1;
  string head = 2;
  repeated GitChangedFile files = 3;
}

message GitFileDiffRequest {
  string repo_path = 1;
  string file = 2;
  string base = 3;
}

message GitFileDiffResponse {
  string status = 1;
  repeated int32 added_lines = 2;
  repeated int32 modified_lines = 3;
}

message LogEntry {
  int64 id = 1;
  int64 time = 2;    // unix milliseconds
  string level = 3;  // "info" | "error"
  string message = 4;
  string source = 5;
}

message LogBatch {
  repeated LogEntry entries = 1;
}

message LogQuery {
  int32 limit = 1; // 0 = last 500
}

message LogList {
  repeated LogEntry entries = 1;
}

message ScriptId {
  int64 id = 1;
}

message ScriptQuery {
  string project = 1; // "" = wszystkie; inaczej globalne + przypięte do projektu
}

message Script {
  int64 id = 1;
  string name = 2;
  string content = 3;
  string project = 6; // folder projektu ("" = globalny)
  int64 created_at = 4;
  int64 updated_at = 5;
}

message ScriptList {
  repeated Script scripts = 1;
}

message GraphStateRequest {
  string key = 1;  // scene key (e.g. project/app root dir)
  string data = 2; // JSON: viewport + node positions
}

message GraphStateKey {
  string key = 1;
}

message GraphStateResponse {
  string data = 1;
}

message DirEntry {
  string name = 1;
  string path = 2;
  bool dir = 3;
}

message DirListing {
  string path = 1;
  string parent = 2;
  repeated DirEntry entries = 3;
}

message FoundProject {
  string name = 1;
  string path = 2;
  string kind = 3;
}

message FoundProjects {
  repeated FoundProject projects = 1;
}

message Conventions {
  string convention = 1; // "dash" | "camel"
  string extension = 2;  // np. "ts"
}

message FileEvent {
  string path = 1; // ścieżka zmienionego pliku/folderu
  string op = 2;   // create | write | remove | rename
  bool dir = 3;    // czy zmiana dotyczy folderu
}

message FilePath {
  string path = 1;
}

message FileContent {
  string content = 1;
}

message FileResult {
  string path = 1;
  bool ok = 2;
}

message SaveRequest {
  string path = 1;
  string content = 2;
}

message CreateRequest {
  string dir = 1;
  string file = 2;
  string name = 3;
}

message CreateFolderRequest {
  string dir = 1;
  string name = 2;
}

message RenameRequest {
  string old_path = 1;
  string file_base = 2;
  string class_name = 3;
  string old_name = 4;
}

message MoveRequest {
  string old_path = 1;
  string target_dir = 2;
}

message ResolveRequest {
  string from = 1;
  string spec = 2;
}

message LinkQuery {
  string path = 1;
  string content = 2;
}

// CodeLink — a clickable span resolving to a definition. Positions are 0-based;
// columns are byte offsets within the line.
message CodeLink {
  uint32 from_line = 1;
  uint32 from_col = 2;
  uint32 to_line = 3;
  uint32 to_col = 4;
  string target_path = 5;
  uint32 target_line = 6;
}

message CodeLinks {
  repeated CodeLink links = 1;
}

message AiAgentRequest {
  string prompt = 1;
  string dir = 2; // domyślny katalog (ostatnio otwarty folder)
  string lang = 3; // UI language for the AI's wording (e.g. "pl", "en")
}

message FileOp {
  string op = 1;   // create_file | write | delete | rename | move | mkdir
  string path = 2; // wynikowa ścieżka
}

message AiAgentResponse {
  repeated FileOp ops = 1; // wykonane operacje
  string open_path = 2;    // plik do otwarcia w edytorze (np. nowo utworzony)
  string message = 3;      // krótkie podsumowanie po polsku
}

// --- AiAsk: agent ze skillami (bidi). Lustro typów z ai.v1, bo gateway.proto jest
// samodzielny (ładowany przez @grpc/proto-loader w Electronie). ---

// AiAskContext — lekki kontekst zadania (treści/graf dobierane skillami przez aplikację).
message AiAskContext {
  string instruction = 1;
  string open_file = 2;
  string selected_kind = 3;
  string selected_name = 4;
  string selected_file = 5;
}

message AiAskStart {
  string prompt = 1;
  string dir = 2;  // cwd / klucz sesji (folder projektu)
  string lang = 3;
  bool edit = 4;
  AiAskContext context = 5;
}

// AiSkillResult — odpowiedź aplikacji na żądanie skilla (po id).
message AiSkillResult {
  string id = 1;
  string content = 2;
  string error = 3;
}

// AiAskClientMsg — wiadomości od aplikacji: start albo wynik skilla.
message AiAskClientMsg {
  oneof msg {
    AiAskStart start = 1;
    AiSkillResult skill_result = 2;
  }
}

message AiToolCall {
  string name = 1;
  string args = 2;
  string result = 3;
}

// AiSkillRequest — serwer prosi aplikację o wykonanie skilla.
message AiSkillRequest {
  string id = 1;
  string name = 2;   // read_file | list_dir | get_graph
  string args = 3;
}

message AiAskEvent {
  oneof event {
    string plan = 1;
    AiToolCall tool = 2;
    string answer = 3;
    AiSkillRequest skill_request = 4;
  }
}

message AiEditRequest {
  string code = 1;
  string prompt = 2;
  string file = 3;
}

message AiEditResponse {
  string code = 1;
}

message AiModelResponse {
  string name = 1;
}

message AiProviderRequest {
  string provider = 1;
}

message AiClaudeTokenRequest {
  string token = 1;
}

message AiClaudeTokenStatus {
  bool has_token = 1;
}

message AiReviewRequest {
  string code = 1;
  string file = 2;
  string lang = 3; // UI language for the AI's wording (e.g. "pl", "en")
}

message Remark {
  int32 line = 1;
  string text = 2;
}

message AiReviewResponse {
  repeated Remark remarks = 1;
}

message AiCompleteRequest {
  string prefix = 1; // kod przed kursorem
  string suffix = 2; // kod po kursorze
  string file = 3;
}

message AiCompleteResponse {
  string text = 1; // tekst do wstawienia w miejscu kursora
}

message EventInput {
  string type = 1;
  string title = 2;
  string body = 3;
  int64 app_id = 4;
  string file = 5;
  string node_id = 6;
}

message Event {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  int64 app_id = 5;
  string file = 6;
  string node_id = 7;
  int64 created_at = 8;
}

message EventQuery {
  string file = 1;
  string node_id = 2;
  int64 app_id = 3;
  int32 limit = 4;
}

message EventList {
  repeated Event events = 1;
}

message Empty {}

message ScanRequest {
  string path = 1;
}

message ScanAppRequest {
  int64 app_id = 1;
}

message AppGraphRequest {
  int64 app_id = 1;
}

// Progress to uproszczone zdarzenie dla UI (modal z progress barem).
message Progress {
  string message = 1;       // log do konsoli
  string current_file = 2;  // nazwa aktualnie czytanego pliku
  int32 files_done = 3;     // ile plików już opisano
  int32 entities_done = 4;  // ile encji już wyciągnięto
  bool done = 5;            // koniec skanowania
  int64 project_id = 6;     // ustawione przy zdarzeniu projektu / na końcu
}

message GraphRequest {
  int64 project_id = 1; // 0 = ostatni przeskanowany projekt
}

// Node to klocek grafu: moduł, kontroler lub serwis, z listą funkcji.
message Node {
  string id = 1;                 // np. "controller:UsersController"
  string kind = 2;               // "module" | "controller" | "service"
  string name = 3;
  string file = 4;
  string app = 5;                // nazwa aplikacji (workspace)
  repeated string functions = 6; // metody do wypisania w klocku
  string route = 7;              // ścieżka kontrolera (puste dla module/service)
  int64 app_id = 8;             // dla węzłów-serwisów (kind="service") w grafie monorepo
  string framework = 9;        // framework aplikacji (dla węzłów-serwisów)
  string abs_file = 10;        // absolutna ścieżka pliku (do otwarcia w edytorze)
  string language = 11;        // język aplikacji/pakietu (dla węzłów app/package)
}

// Edge to połączenie kreską między bytami.
message Edge {
  string from = 1;
  string to = 2;
  string label = 3; // "import" | "controller" | "provider" | "injects"
}

message Graph {
  int64 project_id = 1;
  string folder = 2;
  repeated Node nodes = 3;
  repeated Edge edges = 4;
}

message Project {
  int64 id = 1;
  string folder = 2;
  string git_path = 3;
  string kind = 4;
}

message Projects {
  repeated Project projects = 1;
}
