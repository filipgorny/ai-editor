syntax = "proto3";

package scripting.v1;

option go_package = "github.com/filipgorny/ai-architect/proto/scripting/v1;scriptingv1";

// Scripting stores user scripts (Lua) in Postgres. A script has a name and content.
// The gateway only forwards — all logic and the database live here.
service Scripting {
  // ListScripts returns scripts matching the query (project == "" → all; otherwise
  // global ones + those pinned to the given project).
  rpc ListScripts(ScriptQuery) returns (Scripts);
  // GetScript returns a single script by id.
  rpc GetScript(ScriptId) returns (Script);
  // SaveScript creates (id == 0) or updates a script; returns the saved record.
  rpc SaveScript(Script) returns (Script);
  // DeleteScript removes a script by id.
  rpc DeleteScript(ScriptId) returns (DeleteResult);
}

message Empty {}

message ScriptId {
  int64 id = 1;
}

message Script {
  int64 id = 1;
  string name = 2;
  string content = 3;
  string project = 6;   // project folder the script is pinned to ("" = global)
  int64 created_at = 4; // unix seconds
  int64 updated_at = 5; // unix seconds
}

// ScriptQuery filters the script list. project == "" → all; otherwise global ones
// (project == "") + those pinned to this project.
message ScriptQuery {
  string project = 1;
}

message Scripts {
  repeated Script scripts = 1;
}

message DeleteResult {
  bool ok = 1;
}
