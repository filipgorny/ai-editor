<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.55" stop-color="#3b3ea8"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>

  <!-- editor window -->
  <rect x="176" y="208" width="672" height="608" rx="56" fill="#0d1117"/>
  <rect x="176.5" y="208.5" width="671" height="607" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- title bar dots -->
  <circle cx="252" cy="296" r="21" fill="#ff5f56"/>
  <circle cx="320" cy="296" r="21" fill="#ffbd2e"/>
  <circle cx="388" cy="296" r="21" fill="#27c93f"/>
  <line x1="176" y1="356" x2="848" y2="356" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- code lines -->
  <g>
    <rect x="240" y="430" width="372" height="40" rx="20" fill="#58a6ff"/>
    <rect x="312" y="510" width="300" height="40" rx="20" fill="#bc8cff"/>
    <rect x="312" y="590" width="232" height="40" rx="20" fill="#3fb950"/>
    <rect x="240" y="670" width="196" height="40" rx="20" fill="#8b949e"/>
    <!-- text caret -->
    <rect x="460" y="662" width="14" height="56" rx="7" fill="#58a6ff"/>
  </g>
</svg>
