# Wspólny config monorepo ai-architect. Każdy serwis ma własną sekcję.
# Env nadpisuje (SCANNER_ADDR, DESIGNER_ADDR, GATEWAY_ADDR, AI_ADDR, EVENTS_ADDR,
# SCRIPTING_ADDR, DATABASE_URL, REDIS_ADDR, OLLAMA_HOST, OLLAMA_MODEL, OPENAI_API_KEY).
#
# Przepływ: Electron → gateway → designer → {scanner, Postgres}.
# Cały LLM idzie przez serwis ai. Postgresa dotykają designer (graf) i scripting
# (skrypty). Eventy w Redis.

scanners:
  server:
    addr: 127.0.0.1:50051
  ai_addr: 127.0.0.1:50071     # opis plików idzie przez serwis ai
  plugins:                     # scanner uruchamia WSZYSTKIE na każdym serwisie
    - nestjs
    - react
    - vite
    - go
    - protobuf
    - typescript
  scan:
    concurrency: 0             # 0 = wszystkie rdzenie CPU
    max_files: 0               # 0 = bez limitu
    describe_files: false      # opis plików (wolne na dużych serwisach)

designer:
  addr: 127.0.0.1:50081
  scanner_addr: 127.0.0.1:50051
  database:
    url: postgres://architect:architect@localhost:5432/architect?sslmode=disable

gateway:
  addr: 127.0.0.1:50061
  designer_addr: 127.0.0.1:50081
  filer_addr: 127.0.0.1:50101    # operacje na plikach idą przez filer
  scripting_addr: 127.0.0.1:50111 # skrypty użytkownika idą przez scripting
  logs_addr: 127.0.0.1:50121     # logi aplikacji idą przez logs
  scanner_addr: 127.0.0.1:50051  # analiza kodu (go-to-definition) idzie przez scanner
  git_addr: 127.0.0.1:50131      # autorstwo + diff-review idą przez git

ai:
  addr: 127.0.0.1:50071
  events_addr: 127.0.0.1:50091
  llm:
    provider: ollama           # ollama | openai
    model: qwen2.5-coder:14b
    host: http://localhost:11434

events:
  addr: 127.0.0.1:50091
  redis_addr: 127.0.0.1:6379

# scripting — przechowuje skrypty użytkownika (Lua) w Postgresie (nazwa + treść).
# Drugi (obok designera) serwis dotykający bazy. Gateway tylko pośredniczy.
scripting:
  addr: 127.0.0.1:50111
  database:
    url: postgres://architect:architect@localhost:5432/architect?sslmode=disable

# logs — przechowuje logi aplikacji we własnej bazie. Gateway tylko pośredniczy.
# LOGS_DATABASE_URL (env) pozwala wskazać OSOBNĄ bazę; domyślnie współdzielony Postgres.
logs:
  addr: 127.0.0.1:50121
  database:
    url: postgres://architect:architect@localhost:5432/architect?sslmode=disable

# filer — JEDYNY serwis dotykający systemu plików (czytanie/zapis/operacje +
# przeglądanie dysku i szukanie projektów). Gateway pośredniczy.
# W Dockerze wymaga zamontowania dysku hosta jako wolumen (np. - /home:/home:rw).
filer:
  addr: 127.0.0.1:50101

# git — autorstwo plików (ostatnia zmiana) + diff-review (gałąź vs baza). Otwarty
# projekt wysyła swoją kopię .git przez gateway (UploadRepo); serwis trzyma ją w
# katalogu roboczym (puste = temp OS) i woła binarkę `git`. Gateway pośredniczy.
git:
  addr: 127.0.0.1:50131
  dir: ""
